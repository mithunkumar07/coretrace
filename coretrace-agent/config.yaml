# CoreTrace Agent Configuration

# Agent settings
agent:
  name: "coretrace-agent"
  version: "1.0.0"
  debug: false

# Dashboard connection settings
dashboard:
  enabled: false
  # URL of the CoreTrace dashboard API (http or https)
  url: "http://localhost:8080"
  # API key generated when the agent was registered (POST /api/v1/agents)
  api_key: ""
  # Optional: override the agent ID sent during registration (defaults to hostname)
  agent_id: ""

# Command monitoring settings (requires auditd)
command_monitoring:
  enabled: true
  # Audit log file path
  audit_log_path: "/var/log/audit/audit.log"
  # Alternative path if not using auditd
  fallback_path: "/var/log/audit.log"
  # How often to cleanup stale command records (seconds)
  cleanup_interval: 30
  # Enable debug logging for command parsing
  debug: false

# Logging configuration
logging:
  level: "info"  # debug, info, warn, error
  format: "json" # json, console
  output: "stdout" # stdout, stderr, file path

# SSH monitoring settings
ssh:
  enabled: true
  auth_log_paths:
    - "/var/log/auth.log"
    - "/var/log/secure"
  session_timeout: "24h"
  max_sessions: 1000

# File monitoring settings
file:
  enabled: true
  watch_paths:
    - "/etc"
    - "/home"
    - "/root"
    - "/var/log"
    - "/opt"
    - "/usr/local/bin"
    - "/tmp"
    - "/var/tmp"
  exclude_patterns:
    - "*.tmp"
    - "*.log"
    - ".git/*"
    - "node_modules/*"
    - ".cache/*"
  max_watched_files: 10000

# Event processing settings
events:
  buffer_size: 1000
  flush_interval: "5s"
  output_format: "json"

# Session logging settings
session_logging:
  enabled: true
  # Directory where session logs are stored
  sessions_dir: "/var/log/coretrace/sessions"
  # Maximum time a session can be active before being force-closed
  max_session_duration: "24h"
  # How often to check for stale sessions
  cleanup_interval: "1h"
  # Number of days to retain session directories (daily cleanup)
  retention_days: 30
  
  # Log rotation settings
  rotation:
    # Maximum size in megabytes before rotation
    max_size_mb: 100
    # Maximum number of old log files to retain
    max_backups: 10
    # Maximum number of days to retain old log files
    max_age_days: 30
    # Compress rotated files (gzip)
    compress: true

# Geolocation settings (optional)
geolocation:
  enabled: false
  provider: "ipapi" # ipapi, maxmind, ipstack
  api_key: ""

# Performance settings
performance:
  max_cpu_percent: 50
  max_memory_mb: 512
  gc_percent: 100

# Disk management settings
disk_management:
  # Maximum disk usage percentage before disabling writes (0-100)
  # When disk usage exceeds this threshold, session logging is paused
  # Logging resumes when disk usage drops 5% below threshold
  usage_threshold_percent: 90
  
  # Maximum total size of sessions directory in GB
  # When exceeded, oldest session directories are removed first
  max_sessions_size_gb: 10